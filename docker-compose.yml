version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devopsdb}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-devopspassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devopsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devops-net

  redis:
    image: redis:7.2-alpine
    container_name: devops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devops-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devops-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - devops-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: devops-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/devopsdb
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-devopspassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-W3u+9sX/5J2v8N1q4Y7z0A3c6E9g2I5l8O1r4U7x0A3=}
      PROMETHEUS_URL: http://prometheus:9090
      DOCKER_HOST: tcp://host.docker.internal:2375
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      - devops-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: devops-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge

volumes:
  postgres_data:
