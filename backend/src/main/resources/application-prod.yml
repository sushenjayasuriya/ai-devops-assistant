spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/devopsdb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  encryption:
    key: ${APP_ENCRYPTION_KEY}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://app.devops.ai}

logging:
  level:
    root: WARN
    ai.devops: INFO
    org.springframework.security: WARN
