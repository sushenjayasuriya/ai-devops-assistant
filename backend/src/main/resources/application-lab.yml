spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/devopsdb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:devopspassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      idle-timeout: 60000
      max-lifetime: 600000
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 15
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000 # 15 min
    refresh-token-expiration-ms: 604800000 # 7 days
  encryption:
    key: ${APP_ENCRYPTION_KEY:W3u+9sX/5J2v8N1q4Y7z0A3c6E9g2I5l8O1r4U7x0A3=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
  integrations:
    allow-private-network: true
    prometheus:
      default-url: ${PROMETHEUS_URL:http://localhost:9090}
    docker:
      default-host: ${DOCKER_HOST:tcp://localhost:2375}

logging:
  level:
    root: INFO
    ai.devops: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
