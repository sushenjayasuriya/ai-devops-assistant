version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devops-lab-postgres
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=30
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devopsdb}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-devopspassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_lab:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 48M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devopsdb"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - devops-lab-net

  redis:
    image: redis:7.2-alpine
    container_name: devops-lab-redis
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 48M
        reservations:
          memory: 16M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - devops-lab-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: devops-lab-backend
    environment:
      SPRING_PROFILES_ACTIVE: lab
      DATABASE_URL: jdbc:postgresql://postgres:5432/devopsdb
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-devopspassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-W3u+9sX/5J2v8N1q4Y7z0A3c6E9g2I5l8O1r4U7x0A3=}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://host.docker.internal:9090}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://host.docker.internal:2375}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC -XX:MaxRAMPercentage=50.0"
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 192M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devops-lab-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: devops-lab-frontend
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 48M
        reservations:
          memory: 16M
    depends_on:
      - backend
    networks:
      - devops-lab-net

networks:
  devops-lab-net:
    driver: bridge

volumes:
  postgres_data_lab:
